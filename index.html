<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DardomaMOGS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#17233c;background:radial-gradient(circle at 10% 15%,#ffd250a6 0 45px,transparent 46px),radial-gradient(circle at 90% 20%,#ff82408c 0 55px,transparent 56px),radial-gradient(circle at 15% 85%,#50be646f 0 65px,transparent 66px),linear-gradient(135deg,#fff1a8,#ffd28b,#b8e7b5);background-attachment:fixed}.wrap{max-width:850px;margin:auto;padding:24px}.brand{text-align:center}.status,.card{border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 6px 22px #0002}.status{text-align:center;font-weight:bold;font-size:20px}.open{background:#e7f7e8;color:#176b2c}.closed{background:#ffe7e7;color:#a32222}.card{background:#fffffff2}.product{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee;gap:10px}button{border:0;border-radius:9px;padding:10px 15px;background:#17233c;color:white;font-weight:bold;cursor:pointer}button:disabled{background:#999}.qty button{padding:7px 11px;margin-left:4px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:6px 0 14px;font:inherit}.summary{background:#eef3ff;border-radius:12px;padding:16px;margin:18px 0}.review{background:#fff8df;border:1px solid #e4c75c;border-radius:14px;padding:18px}.review div{padding:7px 0;border-bottom:1px solid #0001}.total{font-size:22px;font-weight:bold}.success{background:#e7f7e8;border-radius:12px;padding:16px}#orderForm,#review{display:none}.secondary{background:#68707c;margin-left:8px}
</style></head><body><div class="wrap"><div class="brand"><h1>🥭 DardomaMOGS 🥭</h1><p>Cool. Fresh. Yours.</p></div><div id="status" class="status"></div><div class="card"><div id="message">Choose a product from your DardomaMOGS website.</div></div><div class="card"><h2>🛒 Your Cart</h2><div id="items"></div><div id="summary"></div><button id="place" onclick="showForm()">Place Order</button><div id="orderForm"><hr><h2>📦 Order Details</h2><label>Name</label><input id="name" placeholder="Your name"><label>Contact</label><input id="contact" placeholder="Your phone or contact"><label>Payment</label><select id="payment"><option value="">Choose a payment method</option><option value="Instapay">🏦 InstaPay</option><option value="Cash on delivery">💵 Cash on delivery</option></select><label>Notes</label><textarea id="notes" rows="3" placeholder="Optional"></textarea><button onclick="review()">Review Order</button></div><div id="review"><hr><h2>📋 Review Your Order</h2><div id="reviewContent" class="review"></div><br><button onclick="send()">✅ Confirm &amp; Send Order</button><button class="secondary" onclick="edit()">✏️ Edit</button></div><div id="result"></div></div></div>
<iframe name="gf" style="display:none"></iframe><form id="form" action="https://docs.google.com/forms/d/e/1FAIpQLSfcFu09aQGcBszMQvutwk_huj8BK4CqtSwdU8HerbVei-lftw/formResponse" method="POST" target="gf" style="display:none"><input name="entry.1661561910" id="g1"><input name="entry.544821231" id="g2"><textarea name="entry.1211593112" id="g3"></textarea><textarea name="entry.212349483" id="g4"></textarea><input name="entry.412155072" id="g5"></form>
<script>
const FEE=20,products={mango:{name:"Mango Dardoma",emoji:"🥭",price:10},karkade:{name:"Karkade Dardoma",emoji:"❤️",price:10},pepsi:{name:"Pepsi Dardoma",emoji:"🥤",price:10}};let cart=JSON.parse(localStorage.getItem("dardoma_cart")||"{}");
function openNow(){let d=new Date(),m=d.getHours()*60+d.getMinutes();return m>=840||m<120}
function status(){let s=document.getElementById("status"),b=document.getElementById("place");if(openNow()){s.className="status open";s.innerHTML="🟢 DardomaMOGS is OPEN!<br><small>Open until 2:00 AM</small>";b.disabled=false}else{s.className="status closed";s.innerHTML="🔴 DardomaMOGS is CLOSED<br><small>We open at 2:00 PM</small>";b.disabled=true;document.getElementById("orderForm").style.display="none";document.getElementById("review").style.display="none"}}
function save(){localStorage.setItem("dardoma_cart",JSON.stringify(cart))}
function add(id){if(!products[id])return;if(!openNow()){alert("DardomaMOGS is currently closed. We're open from 2:00 PM to 2:00 AM.");return}cart[id]=(cart[id]||0)+1;save();render()}
function qty(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];save();render()}
function totals(){let sub=0,lines=[];Object.keys(cart).forEach(id=>{let p=products[id],q=cart[id],v=p.price*q;sub+=v;lines.push({id,p,q,v})});return{lines,sub,total:sub+FEE}}
function render(){let t=totals(),items=document.getElementById("items");if(!t.lines.length){items.innerHTML="<p>Your cart is empty.</p>";document.getElementById("summary").innerHTML="<b>Total: 0 EGP</b>";return}items.innerHTML=t.lines.map(x=>`<div class="product"><div>${x.p.emoji} <b>${x.p.name}</b><br>${x.p.price} EGP × ${x.q} = ${x.v} EGP</div><div class="qty"><button onclick="qty('${x.id}',-1)">−</button><button onclick="qty('${x.id}',1)">+</button></div></div>`).join("");document.getElementById("summary").innerHTML=`<div class="summary">Subtotal: <b>${t.sub} EGP</b><br>🚚 Delivery: <b>${FEE} EGP</b><hr><h2>Total: ${t.total} EGP</h2></div>`}
function showForm(){if(!openNow()){alert("DardomaMOGS is currently closed.");return}if(!Object.keys(cart).length){alert("Your cart is empty!");return}document.getElementById("orderForm").style.display="block";document.getElementById("review").style.display="none"}
function safe(x){let d=document.createElement("div");d.textContent=x;return d.innerHTML}
function review(){if(!openNow())return;let n=document.getElementById("name").value.trim(),c=document.getElementById("contact").value.trim(),p=document.getElementById("payment").value,no=document.getElementById("notes").value.trim();if(!n||!c){alert("Please enter your name and contact information.");return}if(!p){alert("Please choose a payment method.");return}let t=totals(),h=`<div><b>👤 Customer:</b> ${safe(n)}</div><div><b>📱 Contact:</b> ${safe(c)}</div><h3>🛍️ Items</h3>`;t.lines.forEach(x=>h+=`<div>${x.p.emoji} ${safe(x.p.name)} × ${x.q} — ${x.v} EGP</div>`);h+=`<div><b>Subtotal:</b> ${t.sub} EGP</div><div><b>🚚 Delivery:</b> ${FEE} EGP</div><div><b>💳 Payment:</b> ${safe(p)}</div><div class="total">Total: ${t.total} EGP</div>`;if(no)h+=`<div><b>📝 Notes:</b> ${safe(no)}</div>`;document.getElementById("reviewContent").innerHTML=h;document.getElementById("review").style.display="block";document.getElementById("review").scrollIntoView({behavior:"smooth"})}
function edit(){document.getElementById("review").style.display="none";document.getElementById("orderForm").style.display="block"}
function send(){let n=document.getElementById("name").value.trim(),c=document.getElementById("contact").value.trim(),p=document.getElementById("payment").value,no=document.getElementById("notes").value.trim();if(!n||!c||!p){alert("Please complete the order details first.");return}let t=totals(),order=t.lines.map(x=>`${x.p.name} × ${x.q} = ${x.v} EGP`).join("\n")+`\nSubtotal: ${t.sub} EGP\nDelivery: ${FEE} EGP\nTotal: ${t.total} EGP`;document.getElementById("g1").value=n;document.getElementById("g2").value=c;document.getElementById("g3").value=order;document.getElementById("g4").value=no;document.getElementById("g5").value=p;document.getElementById("form").submit();document.getElementById("result").innerHTML=`<div class="success"><h2>✅ Order Sent!</h2><p>Thank you, <b>${safe(n)}</b>!</p><p>Payment: <b>${safe(p)}</b></p><p>Total: <b>${t.total} EGP</b></p>${p==="Instapay"?"<p>🏦 InstaPay selected. Payment can be handled when the order is delivered.</p>":"<p>💵 Please have the payment ready for cash on delivery.</p>"}</div>`;cart={};localStorage.removeItem("dardoma_cart");render();document.getElementById("orderForm").style.display="none";document.getElementById("review").style.display="none"}
let q=new URLSearchParams(location.search).get("product");if(q&&products[q]){add(q);document.getElementById("message").innerHTML="✅ <b>"+products[q].name+"</b> was added to your cart!";history.replaceState({},"",location.pathname)}status();setInterval(status,30000);render();
</script></body></html>
