<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DardomaMOGS Cart</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Arial,sans-serif;
  color:#17233c;
  background:
    radial-gradient(circle at 10% 15%,rgba(255,210,80,.65) 0 45px,transparent 46px),
    radial-gradient(circle at 90% 20%,rgba(255,130,70,.55) 0 55px,transparent 56px),
    radial-gradient(circle at 15% 85%,rgba(80,190,100,.45) 0 65px,transparent 66px),
    radial-gradient(circle at 85% 80%,rgba(255,220,70,.5) 0 70px,transparent 71px),
    linear-gradient(135deg,#fff1a8,#ffd28b,#b8e7b5);
  background-attachment:fixed;
}
.container{max-width:850px;margin:auto;padding:20px}
.brand{text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.card{
  background:rgba(255,255,255,.96);
  border-radius:18px;
  padding:22px;
  margin:18px 0;
  box-shadow:0 6px 22px rgba(0,0,0,.13);
}
.status{
  text-align:center;border-radius:14px;padding:15px;margin:18px 0;
  font-size:20px;font-weight:bold;
}
.open{background:#e7f7e8;color:#176b2c}
.closed{background:#ffe7e7;color:#a32222}

.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;padding:18px 0;border-bottom:1px solid #eee;
}
.item-info{flex:1}
.item-title{font-size:18px;font-weight:bold}
.item-description{font-size:14px;color:#687080;margin:5px 0}
.item-price{font-weight:bold;margin-top:6px}
.quantity-controls{display:flex;align-items:center;gap:7px}
.quantity-number{
  min-width:30px;text-align:center;font-weight:bold;
}
button{
  border:0;border-radius:9px;padding:10px 15px;
  background:#17233c;color:white;font-weight:bold;cursor:pointer;
}
button:hover{opacity:.9}
button:disabled{background:#999;cursor:not-allowed}
.qty-button{padding:7px 11px}
.danger{background:#b42318}
.secondary{background:#68707c;margin-left:8px}
.summary{
  background:#eef3ff;border-radius:12px;padding:16px;margin:20px 0;
}
.empty{text-align:center;padding:25px;font-size:18px;color:#687080}
.sold-out{
  color:#a32222;font-weight:bold;font-size:13px;
}
#orderForm,#reviewSection{display:none}
input,select,textarea{
  width:100%;padding:11px;border:1px solid #ccc;
  border-radius:9px;margin:6px 0 14px;font:inherit;
}
.review{
  background:#fff8df;
  border:1px solid #e4c75c;
  border-radius:14px;
  padding:18px;
}
.review-line{
  padding:8px 0;
  border-bottom:1px solid rgba(0,0,0,.08);
}
.total{font-size:23px;font-weight:bold;margin-top:12px}
.success{
  background:#e7f7e8;
  border-radius:12px;
  padding:18px;
}
.order-status{
  background:#f2f5ff;
  border-radius:14px;
  padding:16px;
  margin-top:18px;
}
.steps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}
.step{
  background:#e2e5ec;
  border-radius:10px;
  padding:10px 5px;
  text-align:center;
  font-size:13px;
  font-weight:bold;
}
.step.active{
  background:#17233c;
  color:white;
}
@media(max-width:600px){
  .container{padding:12px}
  .card{padding:16px}
  .cart-item{align-items:flex-start}
  .quantity-controls{flex-shrink:0}
  .steps{grid-template-columns:1fr 1fr}
  button{min-height:44px}
}
</style>

<script>
const DELIVERY_FEE = 20;

/*
  These products are ONLY used to display items that were
  already added to the cart by your main store.

  There are NO product/add-to-cart buttons on this page.
*/
const products = {
  mango:{
    name:"Mango Dardoma",
    emoji:"🥭",
    price:10,
    description:"Sweet mango flavor.",
    soldOut:false
  },
  karkade:{
    name:"Karkade Dardoma",
    emoji:"❤️",
    price:10,
    description:"Refreshing karkade flavor.",
    soldOut:false
  },
  pepsi:{
    name:"Pepsi Dardoma",
    emoji:"🥤",
    price:10,
    description:"Cool Pepsi flavor.",
    soldOut:false
  }
};

let cart = JSON.parse(
  localStorage.getItem("dardoma_cart") || "{}"
);

function isStoreOpen(){
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();

  return minutes >= 840 || minutes < 120;
}

function updateStoreStatus(){
  const status = document.getElementById("storeStatus");
  const placeButton = document.getElementById("placeOrderButton");

  if(isStoreOpen()){
    status.className = "status open";
    status.innerHTML =
      "🟢 DardomaMOGS is OPEN!<br>" +
      "<small>Open until 2:00 AM</small>";

    placeButton.disabled = false;
  }else{
    status.className = "status closed";
    status.innerHTML =
      "🔴 DardomaMOGS is CLOSED<br>" +
      "<small>We open at 2:00 PM</small>";

    placeButton.disabled = true;
    document.getElementById("orderForm").style.display = "none";
    document.getElementById("reviewSection").style.display = "none";
  }
}

function saveCart(){
  localStorage.setItem(
    "dardoma_cart",
    JSON.stringify(cart)
  );
}

function changeQuantity(id, amount){
  if(!products[id]) return;

  if(products[id].soldOut){
    alert(products[id].name + " is currently sold out.");
    return;
  }

  cart[id] = (cart[id] || 0) + amount;

  if(cart[id] <= 0){
    delete cart[id];
  }

  saveCart();
  renderCart();
}

function clearCart(){
  if(Object.keys(cart).length === 0){
    alert("Your cart is already empty.");
    return;
  }

  if(confirm("Are you sure you want to clear your cart?")){
    cart = {};
    saveCart();
    renderCart();
  }
}

function getOrderTotals(){
  let subtotal = 0;
  const lines = [];

  Object.keys(cart).forEach(id=>{
    const product = products[id];

    if(!product){
      delete cart[id];
      return;
    }

    const quantity = cart[id];
    const itemTotal = product.price * quantity;

    subtotal += itemTotal;

    lines.push({
      id:id,
      product:product,
      quantity:quantity,
      itemTotal:itemTotal
    });
  });

  return {
    lines:lines,
    subtotal:subtotal,
    delivery:DELIVERY_FEE,
    total:subtotal + DELIVERY_FEE
  };
}

function renderCart(){
  const container = document.getElementById("cartItems");
  const totals = getOrderTotals();

  saveCart();

  if(totals.lines.length === 0){
    container.innerHTML = `
      <div class="empty">
        🛒 Your cart is empty.
      </div>
    `;

    document.getElementById("cartSummary").innerHTML =
      "<strong>Total: 0 EGP</strong>";

    document.getElementById("clearCartButton").disabled = true;
    document.getElementById("placeOrderButton").disabled = true;

    return;
  }

  document.getElementById("clearCartButton").disabled = false;

  document.getElementById("placeOrderButton").disabled =
    !isStoreOpen();

  container.innerHTML = totals.lines.map(item=>{
    const p = item.product;

    return `
      <div class="cart-item">

        <div class="item-info">
          <div class="item-title">
            ${p.emoji} ${escapeHTML(p.name)}
          </div>

          <div class="item-description">
            ${escapeHTML(p.description)}
          </div>

          ${
            p.soldOut
            ? '<div class="sold-out">❌ SOLD OUT</div>'
            : ''
          }

          <div class="item-price">
            ${p.price} EGP × ${item.quantity}
            = ${item.itemTotal} EGP
          </div>
        </div>

        <div class="quantity-controls">
          <button
            class="qty-button"
            onclick="changeQuantity('${item.id}',-1)"
            ${p.soldOut ? "disabled" : ""}
          >−</button>

          <span class="quantity-number">
            ${item.quantity}
          </span>

          <button
            class="qty-button"
            onclick="changeQuantity('${item.id}',1)"
            ${p.soldOut ? "disabled" : ""}
          >+</button>
        </div>

      </div>
    `;
  }).join("");

  document.getElementById("cartSummary").innerHTML = `
    <div class="summary">
      Subtotal:
      <strong>${totals.subtotal} EGP</strong>
      <br><br>

      🚚 Delivery:
      <strong>${totals.delivery} EGP</strong>

      <hr>

      <h2>Total: ${totals.total} EGP</h2>
    </div>
  `;
}

function showOrderForm(){
  if(!isStoreOpen()){
    alert(
      "DardomaMOGS is currently closed. " +
      "We're open from 2:00 PM to 2:00 AM."
    );
    return;
  }

  if(Object.keys(cart).length === 0){
    alert("Your cart is empty!");
    return;
  }

  document.getElementById("orderForm").style.display = "block";
  document.getElementById("reviewSection").style.display = "none";
  document.getElementById("result").innerHTML = "";
}

function showReview(){
  if(!isStoreOpen()){
    alert(
      "DardomaMOGS is currently closed. " +
      "Please order between 2:00 PM and 2:00 AM."
    );
    return;
  }

  const name =
    document.getElementById("customerName").value.trim();

  const contact =
    document.getElementById("customerContact").value.trim();

  const payment =
    document.getElementById("paymentMethod").value;

  const notes =
    document.getElementById("customerNotes").value.trim();

  if(!name || !contact){
    alert("Please enter your name and contact information.");
    return;
  }

  if(!payment){
    alert("Please choose a payment method.");
    return;
  }

  const totals = getOrderTotals();

  let html = `
    <div class="review-line">
      <strong>👤 Customer:</strong>
      ${escapeHTML(name)}
    </div>

    <div class="review-line">
      <strong>📱 Contact:</strong>
      ${escapeHTML(contact)}
    </div>

    <h3>🛍️ Items</h3>
  `;

  totals.lines.forEach(item=>{
    html += `
      <div class="review-line">
        ${item.product.emoji}
        ${escapeHTML(item.product.name)}
        × ${item.quantity}
        — ${item.itemTotal} EGP
      </div>
    `;
  });

  html += `
    <div class="review-line">
      <strong>Subtotal:</strong>
      ${totals.subtotal} EGP
    </div>

    <div class="review-line">
      <strong>🚚 Delivery:</strong>
      ${totals.delivery} EGP
    </div>

    <div class="review-line">
      <strong>💳 Payment:</strong>
      ${escapeHTML(payment)}
    </div>

    <div class="total">
      Total: ${totals.total} EGP
    </div>
  `;

  if(notes){
    html += `
      <div class="review-line">
        <strong>📝 Notes:</strong>
        ${escapeHTML(notes)}
      </div>
    `;
  }

  document.getElementById("reviewContent").innerHTML = html;

  document.getElementById("reviewSection").style.display = "block";

  document.getElementById("reviewSection")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
}

function editOrder(){
  document.getElementById("reviewSection").style.display = "none";
  document.getElementById("orderForm").style.display = "block";
}

function createOrderNumber(){
  return "DM-" +
    Math.floor(1000 + Math.random() * 9000);
}

async function confirmAndSend(){
  if(!isStoreOpen()){
    alert("DardomaMOGS is currently closed. Please order between 2:00 PM and 2:00 AM.");
    return;
  }

  const name = document.getElementById("customerName").value.trim();
  const contact = document.getElementById("customerContact").value.trim();
  const payment = document.getElementById("paymentMethod").value;
  const notes = document.getElementById("customerNotes").value.trim();

  if(!name || !contact || !payment){
    alert("Please complete the order details first.");
    return;
  }

  if(!Object.keys(cart).length){
    alert("Your cart is empty.");
    return;
  }

  const totals = getOrderTotals();
  const orderNumber = createOrderNumber();
  const trackingToken = createTrackingToken();

  const orderText =
    "Order Number: " + orderNumber + "
" +
    totals.lines.map(item =>
      item.product.name + " × " + item.quantity + " = " + item.itemTotal + " EGP"
    ).join("
") +
    "
Subtotal: " + totals.subtotal + " EGP" +
    "
Delivery: " + totals.delivery + " EGP" +
    "
Total: " + totals.total + " EGP";

  try{
    await dardomaDb.collection("orderRequests").add({
      number:orderNumber,
      name:name,
      contact:contact,
      items:orderText,
      notes:notes,
      total:Number(totals.total),
      payment:payment,
      status:"received",
      trackingToken:trackingToken,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    await dardomaDb.collection("tracking").doc(trackingToken).set({
      token:trackingToken,
      number:orderNumber,
      status:"received",
      lat:null,
      lng:null
    });

    document.getElementById("gName").value=name;
    document.getElementById("gContact").value=contact;
    document.getElementById("gOrder").value=orderText;
    document.getElementById("gNotes").value=notes;
    document.getElementById("gPayment").value=payment;
    document.getElementById("realGoogleForm").submit();

    document.getElementById("result").innerHTML=`
      <div class="success">
        <h2>✅ Order Sent!</h2>
        <p><strong>Order #${escapeHTML(orderNumber)}</strong></p>
        <p>Your private tracking code:</p>
        <p><strong>${escapeHTML(trackingToken)}</strong></p>
        <button type="button" onclick="openCustomerTracking('${escapeHTML(trackingToken)}')">
          🔎 Track This Order
        </button>
      </div>
    `;

    cart={};
    localStorage.removeItem("dardoma_cart");
    renderCart();
    document.getElementById("orderForm").style.display="none";
    document.getElementById("reviewSection").style.display="none";

  }catch(error){
    console.error(error);
    alert("We couldn't save the order yet. Please try again.

"+error.message);
  }
}

function escapeHTML(text){
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

/*
  Optional direct product-link support.

  Your MAIN STORE can send someone to:
  index.html?product=mango

  That adds the item automatically.

  There are still NO add-to-cart buttons on this page.
*/
const params = new URLSearchParams(window.location.search);
const productFromLink = params.get("product") || params.get("add");

if(productFromLink && products[productFromLink]){
  if(!products[productFromLink].soldOut){
    cart[productFromLink] = (cart[productFromLink] || 0) + 1;
    saveCart();
  }

  // Remove the add-product query so refreshing the Cart does not add
  // the same product again.
  const cleanUrl = window.location.pathname + window.location.hash;
  history.replaceState({}, "", cleanUrl);
}

updateStoreStatus();
renderCart();

setInterval(updateStoreStatus,30000);
</script>


<script>
const DARDOMA_ADMIN_EMAIL = "YOUR_BROTHER_EMAIL";

const firebaseConfig = {
  apiKey: "AIzaSyBFGaDTOjaFokQi1H1_ia_tl6huMRXMU08",
  authDomain: "dardomamogs.firebaseapp.com",
  projectId: "dardomamogs",
  storageBucket: "dardomamogs.firebasestorage.app",
  messagingSenderId: "127475908076",
  appId: "1:127475908076:web:0c5eab2941ae87265014c9",
  measurementId: "G-67XLGPBFNT"
};

firebase.initializeApp(firebaseConfig);
const dardomaAuth = firebase.auth();
const dardomaDb = firebase.firestore();

let adminOrdersUnsubscribe = null;
let customerTrackingUnsubscribe = null;
let customerMap = null;

function createTrackingToken(){
  const bytes = new Uint8Array(18);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
}

function openSystemPanel(panelId){
  document.querySelectorAll(".system-panel").forEach(p=>p.classList.remove("active"));
  const panel = document.getElementById(panelId);
  if(panel){
    panel.classList.add("active");
    panel.scrollIntoView({behavior:"smooth",block:"start"});
  }
}

function adminGoogleSignIn(){
  const message = document.getElementById("adminAuthMessage");
  message.textContent = "Opening Google sign-in...";

  const provider = new firebase.auth.GoogleAuthProvider();

  dardomaAuth.signInWithPopup(provider)
    .then(result => handleAdminUser(result.user))
    .catch(error => {
      console.error(error);
      message.textContent = "❌ " + (error.message || error.code);
    });
}

function adminGoogleSignOut(){
  dardomaAuth.signOut();
}

function handleAdminUser(user){
  const allowed = DARDOMA_ADMIN_EMAIL.trim().toLowerCase();
  const email = (user.email || "").trim().toLowerCase();
  const message = document.getElementById("adminAuthMessage");

  if(!allowed || allowed === "your_brother_email"){
    message.textContent = "⚠️ Set DARDOMA_ADMIN_EMAIL first.";
    return;
  }

  if(email !== allowed){
    message.textContent = "❌ This Google account is not authorized.";
    document.getElementById("adminSignedIn").style.display = "none";
    document.getElementById("adminSignedOut").style.display = "block";
    return;
  }

  document.getElementById("adminSignedOut").style.display = "none";
  document.getElementById("adminSignedIn").style.display = "block";
  document.getElementById("adminIdentity").textContent = "Signed in as: " + user.email;
  loadAdminOrders();
}

dardomaAuth.onAuthStateChanged(user => {
  if(user) handleAdminUser(user);
  else {
    document.getElementById("adminSignedOut").style.display = "block";
    document.getElementById("adminSignedIn").style.display = "none";
  }
});

function loadAdminOrders(){
  const box = document.getElementById("adminOrders");
  box.innerHTML = "<p>Loading orders...</p>";

  if(adminOrdersUnsubscribe) adminOrdersUnsubscribe();

  adminOrdersUnsubscribe = dardomaDb.collection("orderRequests")
    .orderBy("createdAt","desc")
    .onSnapshot(snapshot => {
      if(snapshot.empty){
        box.innerHTML = "<p>No orders yet.</p>";
        return;
      }

      box.innerHTML = "";

      snapshot.forEach(doc => {
        const o = doc.data();
        const status = o.status || "received";
        const card = document.createElement("div");
        card.className = "order-card";

        card.innerHTML = `
          <h3>📦 ${escapeHTML(o.number || doc.id)}</h3>
          <p><b>Customer:</b> ${escapeHTML(o.name || "")}</p>
          <p><b>Contact:</b> ${escapeHTML(o.contact || "")}</p>
          <p><b>Items:</b><br>${escapeHTML(o.items || "").replace(/\n/g,"<br>")}</p>
          <p><b>Total:</b> ${escapeHTML(o.total)} EGP</p>
          <p><b>Payment:</b> ${escapeHTML(o.payment || "")}</p>
          <p><b>Tracking:</b> ${escapeHTML(o.trackingToken || "")}</p>

          <select data-status>
            <option value="received" ${status==="received"?"selected":""}>🟡 Received</option>
            <option value="preparing" ${status==="preparing"?"selected":""}>🔵 Preparing</option>
            <option value="delivery" ${status==="delivery"?"selected":""}>🚚 Out for delivery</option>
            <option value="delivered" ${status==="delivered"?"selected":""}>🟢 Delivered</option>
          </select>

          <div class="location-grid">
            <input data-lat type="number" step="any" placeholder="Latitude" value="${escapeHTML(o.lat ?? "")}">
            <input data-lng type="number" step="any" placeholder="Longitude" value="${escapeHTML(o.lng ?? "")}">
          </div>

          <button type="button" data-save>💾 Save</button>
          <p data-message class="small-muted"></p>
        `;

        card.querySelector("[data-save]").onclick = async () => {
          const newStatus = card.querySelector("[data-status]").value;
          const latRaw = card.querySelector("[data-lat]").value.trim();
          const lngRaw = card.querySelector("[data-lng]").value.trim();
          const lat = latRaw === "" ? null : Number(latRaw);
          const lng = lngRaw === "" ? null : Number(lngRaw);
          const message = card.querySelector("[data-message]");

          try{
            await dardomaDb.collection("orderRequests").doc(doc.id).update({
              status:newStatus,
              lat:lat,
              lng:lng,
              updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            });

            if(o.trackingToken){
              await dardomaDb.collection("tracking").doc(o.trackingToken).set({
                token:o.trackingToken,
                number:o.number || "",
                status:newStatus,
                lat:lat,
                lng:lng
              },{merge:true});
            }

            message.textContent = "✅ Saved!";
          }catch(error){
            console.error(error);
            message.textContent = "❌ " + (error.message || "Could not save.");
          }
        };

        box.appendChild(card);
      });
    }, error => {
      console.error(error);
      box.innerHTML = "<p style='color:#b00020'>❌ " + escapeHTML(error.message) + "</p>";
    });
}

function trackCustomerOrder(){
  const token = document.getElementById("trackingTokenInput").value.trim();
  const result = document.getElementById("customerTrackingResult");

  if(!token){
    result.innerHTML = "<p>Enter a tracking code first.</p>";
    return;
  }

  if(customerTrackingUnsubscribe) customerTrackingUnsubscribe();

  customerTrackingUnsubscribe = dardomaDb.collection("tracking").doc(token)
    .onSnapshot(doc => {
      if(!doc.exists){
        result.innerHTML = "<p style='color:#b00020'>❌ Tracking code not found.</p>";
        return;
      }

      const d = doc.data();
      const status = d.status || "received";

      result.innerHTML = `
        <div class="order-card">
          <h3>📦 Order #${escapeHTML(d.number || "")}</h3>
          <p class="status-pill">${trackingStatusLabel(status)}</p>
          <div class="steps">
            <div class="step ${statusIndex(status)>=0?"active":""}">🟡<br>Received</div>
            <div class="step ${statusIndex(status)>=1?"active":""}">🔵<br>Preparing</div>
            <div class="step ${statusIndex(status)>=2?"active":""}">🚚<br>Out for delivery</div>
            <div class="step ${statusIndex(status)>=3?"active":""}">🟢<br>Delivered</div>
          </div>
          <div id="customerMap" class="map-box"></div>
        </div>
      `;

      if(d.lat != null && d.lng != null && typeof L !== "undefined"){
        if(customerMap) customerMap.remove();
        customerMap = L.map("customerMap").setView([d.lat,d.lng],15);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
          attribution:"&copy; OpenStreetMap contributors"
        }).addTo(customerMap);
        L.marker([d.lat,d.lng]).addTo(customerMap)
          .bindPopup("🚚 DardomaMOGS delivery location").openPopup();
      }
    }, error => {
      result.innerHTML = "<p style='color:#b00020'>❌ " + escapeHTML(error.message) + "</p>";
    });
}

function openCustomerTracking(token){
  openSystemPanel("customerTrackingPanel");
  document.getElementById("trackingTokenInput").value = token;
  trackCustomerOrder();
}

function trackingStatusLabel(s){
  return ({received:"🟡 Received",preparing:"🔵 Preparing",delivery:"🚚 Out for delivery",delivered:"🟢 Delivered"})[s] || s;
}

function statusIndex(s){
  return ({received:0,preparing:1,delivery:2,delivered:3})[s] ?? 0;
}

window.addEventListener("DOMContentLoaded",()=>{
  if(location.hash.startsWith("#track=")){
    openCustomerTracking(decodeURIComponent(location.hash.substring(7)));
  }
});
</script>


<script>
/*
  HOME-PAGE ADD-TO-CART HELPER
  From the Home page, use:
    addProductToCart("mango")
    addProductToCart("karkade")
    addProductToCart("pepsi")

  Or link directly to the Cart with:
    cart/index.html?product=mango
*/
function addProductToCart(productId){
  if(!productId){
    return;
  }

  const cartUrl = "index.html?product=" + encodeURIComponent(productId);
  window.location.href = cartUrl;
}
</script>
