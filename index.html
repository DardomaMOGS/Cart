<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DardomaMOGS Cart</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Arial,sans-serif;
  color:#17233c;
  background:
    radial-gradient(circle at 10% 15%,rgba(255,210,80,.65) 0 45px,transparent 46px),
    radial-gradient(circle at 90% 20%,rgba(255,130,70,.55) 0 55px,transparent 56px),
    radial-gradient(circle at 15% 85%,rgba(80,190,100,.45) 0 65px,transparent 66px),
    radial-gradient(circle at 85% 80%,rgba(255,220,70,.5) 0 70px,transparent 71px),
    linear-gradient(135deg,#fff1a8,#ffd28b,#b8e7b5);
  background-attachment:fixed;
}
.container{max-width:850px;margin:auto;padding:20px}
.brand{text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.card{
  background:rgba(255,255,255,.96);
  border-radius:18px;
  padding:22px;
  margin:18px 0;
  box-shadow:0 6px 22px rgba(0,0,0,.13);
}
.status{
  text-align:center;border-radius:14px;padding:15px;margin:18px 0;
  font-size:20px;font-weight:bold;
}
.open{background:#e7f7e8;color:#176b2c}
.closed{background:#ffe7e7;color:#a32222}

.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;padding:18px 0;border-bottom:1px solid #eee;
}
.item-info{flex:1}
.item-title{font-size:18px;font-weight:bold}
.item-description{font-size:14px;color:#687080;margin:5px 0}
.item-price{font-weight:bold;margin-top:6px}
.quantity-controls{display:flex;align-items:center;gap:7px}
.quantity-number{
  min-width:30px;text-align:center;font-weight:bold;
}
button{
  border:0;border-radius:9px;padding:10px 15px;
  background:#17233c;color:white;font-weight:bold;cursor:pointer;
}
button:hover{opacity:.9}
button:disabled{background:#999;cursor:not-allowed}
.qty-button{padding:7px 11px}
.danger{background:#b42318}
.secondary{background:#68707c;margin-left:8px}
.summary{
  background:#eef3ff;border-radius:12px;padding:16px;margin:20px 0;
}
.empty{text-align:center;padding:25px;font-size:18px;color:#687080}
.sold-out{
  color:#a32222;font-weight:bold;font-size:13px;
}
#orderForm,#reviewSection{display:none}
input,select,textarea{
  width:100%;padding:11px;border:1px solid #ccc;
  border-radius:9px;margin:6px 0 14px;font:inherit;
}
.review{
  background:#fff8df;
  border:1px solid #e4c75c;
  border-radius:14px;
  padding:18px;
}
.review-line{
  padding:8px 0;
  border-bottom:1px solid rgba(0,0,0,.08);
}
.total{font-size:23px;font-weight:bold;margin-top:12px}
.success{
  background:#e7f7e8;
  border-radius:12px;
  padding:18px;
}
.order-status{
  background:#f2f5ff;
  border-radius:14px;
  padding:16px;
  margin-top:18px;
}
.steps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}
.step{
  background:#e2e5ec;
  border-radius:10px;
  padding:10px 5px;
  text-align:center;
  font-size:13px;
  font-weight:bold;
}
.step.active{
  background:#17233c;
  color:white;
}
@media(max-width:600px){
  .container{padding:12px}
  .card{padding:16px}
  .cart-item{align-items:flex-start}
  .quantity-controls{flex-shrink:0}
  .steps{grid-template-columns:1fr 1fr}
  button{min-height:44px}
}

/* ===== Firebase order system ===== */
.system-nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.system-nav button{background:#17233c}
.system-panel{display:none}
.system-panel.active{display:block}
.track-box,.admin-box{background:#f7f9ff;border:1px solid #d9e0f2;border-radius:14px;padding:18px;margin-top:15px}
.order-card{border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0;background:#fff}
.admin-row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.admin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.admin-actions button{font-size:13px}
.status-pill{display:inline-block;padding:7px 10px;border-radius:9px;background:#eef1f7;font-weight:bold}
.steps{display:flex;justify-content:space-between;gap:8px;margin-top:15px}
.step{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:#eee;color:#777;font-size:13px}
.step.active{background:#dff2e1;color:#176b2c;font-weight:bold}
.notice-nearby{background:#e7f7e8;color:#176b2c;border-radius:12px;padding:14px;margin-top:14px;font-weight:bold}
.map-box{height:330px;border-radius:14px;margin-top:14px;overflow:hidden}
.location-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small-muted{font-size:13px;color:#687080}
@media(max-width:600px){.location-grid{grid-template-columns:1fr}.admin-actions button{width:100%}.steps{flex-direction:column}}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>
<div class="container">

<div class="brand">
  <h1>🥭 DardomaMOGS 🥭</h1>
  <p>🛒 Your Cart</p>
</div>

<div id="storeStatus" class="status"></div>

<div class="card">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <div id="cartSummary"></div>

  <button id="clearCartButton" class="danger" onclick="clearCart()">
    🗑️ Clear Cart
  </button>

  <button id="placeOrderButton" onclick="showOrderForm()">
    Place Order
  </button>

  <div id="orderForm">
    <hr>
    <h2>📦 Order Details</h2>

    <label>Customer Name</label>
    <input id="customerName" type="text" placeholder="Your name">

    <label>Contact Information</label>
    <input id="customerContact" type="text" placeholder="Your phone or contact">

    <label>Payment Method</label>
    <select id="paymentMethod">
      <option value="">Choose a payment method</option>
      <option value="Instapay">🏦 InstaPay</option>
      <option value="Cash on delivery">💵 Cash on delivery</option>
    </select>

    <label>Notes</label>
    <textarea id="customerNotes" rows="3" placeholder="Optional"></textarea>

    <button onclick="showReview()">Review Order</button>
  </div>

  <div id="reviewSection">
    <hr>
    <h2>📋 Review Your Order</h2>
    <div id="reviewContent" class="review"></div>
    <br>

    <button onclick="confirmAndSend()">
      ✅ Confirm &amp; Send Order
    </button>

    <button class="secondary" onclick="editOrder()">
      ✏️ Edit
    </button>
  </div>

  <div id="result"></div>
</div>

</div>


<div class="card">
  <h2>📦 Order Tools</h2>
  <div class="system-nav">
    <button type="button" onclick="openSystemPanel('customerTrackingPanel')">🔎 Track Order</button>
  </div>

  <div id="customerTrackingPanel" class="system-panel">
    <div class="track-box">
      <h3>🔎 Track Your Order</h3>
      <p class="small-muted">Use the tracking code from your order confirmation.</p>
      <input id="trackingTokenInput" type="text" placeholder="Enter tracking code">
      <button type="button" onclick="trackCustomerOrder()">Track Order</button>
      <div id="customerTrackingResult"></div>
    </div>
  </div>

  <!-- The admin dashboard is intentionally NOT linked from the customer UI.
       Open this same page with #admin when you are the admin. -->
  <div id="adminPanel" class="system-panel">
    <div class="admin-box">
      <h3>🔐 DardomaMOGS Admin</h3>
      <div id="adminSignedOut">
        <p>Admin access is protected by Google sign-in.</p>
        <button type="button" onclick="adminGoogleSignIn()">Sign in with Google</button>
        <p id="adminAuthMessage" class="small-muted"></p>
      </div>
      <div id="adminSignedIn" style="display:none">
        <div class="admin-row">
          <strong id="adminIdentity"></strong>
          <button type="button" class="danger" onclick="adminGoogleSignOut()">Sign out</button>
        </div>
        <div id="adminOrders"></div>
      </div>
    </div>
  </div>
</div>

<iframe name="googleFormFrame" style="display:none"></iframe>

<form id="realGoogleForm"
action="https://docs.google.com/forms/d/e/1FAIpQLSfcFu09aQGcBszMQvutwk_huj8BK4CqtSwdU8HerbVei-lftw/formResponse"
method="POST"
target="googleFormFrame"
style="display:none">

<input name="entry.1661561910" id="gName">

<textarea name="entry.1211593112" id="gOrder"></textarea>
<textarea name="entry.212349483" id="gNotes"></textarea>
<input name="entry.412155072" id="gPayment">

</form>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const DARDOMA_ADMIN_EMAIL = "dorkymayhim90@gmail.com";

const firebaseConfig = {
  apiKey: "AIzaSyBFGaDTOjaFokQi1H1_ia_tl6huMRXMU08",
  authDomain: "dardomamogs.firebaseapp.com",
  projectId: "dardomamogs",
  storageBucket: "dardomamogs.firebasestorage.app",
  messagingSenderId: "127475908076",
  appId: "1:127475908076:web:0c5eab2941ae87265014c9",
  measurementId: "G-67XLGPBFNT"
};

firebase.initializeApp(firebaseConfig);
const dardomaAuth = firebase.auth();
const dardomaDb = firebase.firestore();
let adminOrdersUnsubscribe = null;
let customerTrackingUnsubscribe = null;
let customerMap = null;
let customerMarker = null;
</script>

<script>
const DELIVERY_FEE = 20;

/*
  These products are ONLY used to display items that were
  already added to the cart by your main store.

  There are NO product/add-to-cart buttons on this page.
*/
const products = {
  mango:{
    name:"Mango Dardoma",
    emoji:"🥭",
    price:10,
    description:"Sweet mango flavor.",
    soldOut:false
  },
  karkade:{
    name:"Karkade Dardoma",
    emoji:"❤️",
    price:10,
    description:"Refreshing karkade flavor.",
    soldOut:false
  },
  pepsi:{
    name:"Pepsi Dardoma",
    emoji:"🥤",
    price:10,
    description:"Cool Pepsi flavor.",
    soldOut:false
  }
};

let cart = JSON.parse(
  localStorage.getItem("dardoma_cart") || "{}"
);

function isStoreOpen(){
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();

  return minutes >= 840 || minutes < 120;
}

function updateStoreStatus(){
  const status = document.getElementById("storeStatus");
  const placeButton = document.getElementById("placeOrderButton");

  if(isStoreOpen()){
    status.className = "status open";
    status.innerHTML =
      "🟢 DardomaMOGS is OPEN!<br>" +
      "<small>Open until 2:00 AM</small>";

    placeButton.disabled = false;
  }else{
    status.className = "status closed";
    status.innerHTML =
      "🔴 DardomaMOGS is CLOSED<br>" +
      "<small>We open at 2:00 PM</small>";

    placeButton.disabled = true;
    document.getElementById("orderForm").style.display = "none";
    document.getElementById("reviewSection").style.display = "none";
  }
}

function saveCart(){
  localStorage.setItem(
    "dardoma_cart",
    JSON.stringify(cart)
  );
}

function changeQuantity(id, amount){
  if(!products[id]) return;

  if(products[id].soldOut){
    alert(products[id].name + " is currently sold out.");
    return;
  }

  cart[id] = (cart[id] || 0) + amount;

  if(cart[id] <= 0){
    delete cart[id];
  }

  saveCart();
  renderCart();
}

function clearCart(){
  if(Object.keys(cart).length === 0){
    alert("Your cart is already empty.");
    return;
  }

  if(confirm("Are you sure you want to clear your cart?")){
    cart = {};
    saveCart();
    renderCart();
  }
}

function getOrderTotals(){
  let subtotal = 0;
  const lines = [];

  Object.keys(cart).forEach(id=>{
    const product = products[id];

    if(!product){
      delete cart[id];
      return;
    }

    const quantity = cart[id];
    const itemTotal = product.price * quantity;

    subtotal += itemTotal;

    lines.push({
      id:id,
      product:product,
      quantity:quantity,
      itemTotal:itemTotal
    });
  });

  return {
    lines:lines,
    subtotal:subtotal,
    delivery:DELIVERY_FEE,
    total:subtotal + DELIVERY_FEE
  };
}

function renderCart(){
  const container = document.getElementById("cartItems");
  const totals = getOrderTotals();

  saveCart();

  if(totals.lines.length === 0){
    container.innerHTML = `
      <div class="empty">
        🛒 Your cart is empty.
      </div>
    `;

    document.getElementById("cartSummary").innerHTML =
      "<strong>Total: 0 EGP</strong>";

    document.getElementById("clearCartButton").disabled = true;
    document.getElementById("placeOrderButton").disabled = true;

    return;
  }

  document.getElementById("clearCartButton").disabled = false;

  document.getElementById("placeOrderButton").disabled =
    !isStoreOpen();

  container.innerHTML = totals.lines.map(item=>{
    const p = item.product;

    return `
      <div class="cart-item">

        <div class="item-info">
          <div class="item-title">
            ${p.emoji} ${escapeHTML(p.name)}
          </div>

          <div class="item-description">
            ${escapeHTML(p.description)}
          </div>

          ${
            p.soldOut
            ? '<div class="sold-out">❌ SOLD OUT</div>'
            : ''
          }

          <div class="item-price">
            ${p.price} EGP × ${item.quantity}
            = ${item.itemTotal} EGP
          </div>
        </div>

        <div class="quantity-controls">
          <button
            class="qty-button"
            onclick="changeQuantity('${item.id}',-1)"
            ${p.soldOut ? "disabled" : ""}
          >−</button>

          <span class="quantity-number">
            ${item.quantity}
          </span>

          <button
            class="qty-button"
            onclick="changeQuantity('${item.id}',1)"
            ${p.soldOut ? "disabled" : ""}
          >+</button>
        </div>

      </div>
    `;
  }).join("");

  document.getElementById("cartSummary").innerHTML = `
    <div class="summary">
      Subtotal:
      <strong>${totals.subtotal} EGP</strong>
      <br><br>

      🚚 Delivery:
      <strong>${totals.delivery} EGP</strong>

      <hr>

      <h2>Total: ${totals.total} EGP</h2>
    </div>
  `;
}

function showOrderForm(){
  if(!isStoreOpen()){
    alert(
      "DardomaMOGS is currently closed. " +
      "We're open from 2:00 PM to 2:00 AM."
    );
    return;
  }

  if(Object.keys(cart).length === 0){
    alert("Your cart is empty!");
    return;
  }

  document.getElementById("orderForm").style.display = "block";
  document.getElementById("reviewSection").style.display = "none";
  document.getElementById("result").innerHTML = "";
}

function showReview(){
  if(!isStoreOpen()){
    alert(
      "DardomaMOGS is currently closed. " +
      "Please order between 2:00 PM and 2:00 AM."
    );
    return;
  }

  const name =
    document.getElementById("customerName").value.trim();

  const contact =
    document.getElementById("customerContact").value.trim();

  const payment =
    document.getElementById("paymentMethod").value;

  const notes =
    document.getElementById("customerNotes").value.trim();

  if(!name || !contact){
    alert("Please enter your name and contact information.");
    return;
  }

  if(!payment){
    alert("Please choose a payment method.");
    return;
  }

  const totals = getOrderTotals();

  let html = `
    <div class="review-line">
      <strong>👤 Customer:</strong>
      ${escapeHTML(name)}
    </div>

    <div class="review-line">
      <strong>📱 Contact:</strong>
      ${escapeHTML(contact)}
    </div>

    <h3>🛍️ Items</h3>
  `;

  totals.lines.forEach(item=>{
    html += `
      <div class="review-line">
        ${item.product.emoji}
        ${escapeHTML(item.product.name)}
        × ${item.quantity}
        — ${item.itemTotal} EGP
      </div>
    `;
  });

  html += `
    <div class="review-line">
      <strong>Subtotal:</strong>
      ${totals.subtotal} EGP
    </div>

    <div class="review-line">
      <strong>🚚 Delivery:</strong>
      ${totals.delivery} EGP
    </div>

    <div class="review-line">
      <strong>💳 Payment:</strong>
      ${escapeHTML(payment)}
    </div>

    <div class="total">
      Total: ${totals.total} EGP
    </div>
  `;

  if(notes){
    html += `
      <div class="review-line">
        <strong>📝 Notes:</strong>
        ${escapeHTML(notes)}
      </div>
    `;
  }

  document.getElementById("reviewContent").innerHTML = html;

  document.getElementById("reviewSection").style.display = "block";

  document.getElementById("reviewSection")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
}

function editOrder(){
  document.getElementById("reviewSection").style.display = "none";
  document.getElementById("orderForm").style.display = "block";
}

function createOrderNumber(){
  return "DM-" +
    Math.floor(1000 + Math.random() * 9000);
}

async function confirmAndSend(){
  if(!isStoreOpen()){
    alert("DardomaMOGS is currently closed. Please order between 2:00 PM and 2:00 AM.");
    return;
  }

  const name=document.getElementById("customerName").value.trim();
  const contact=document.getElementById("customerContact").value.trim();
  const payment=document.getElementById("paymentMethod").value;
  const notes=document.getElementById("customerNotes").value.trim();

  if(!name || !contact || !payment){
    alert("Please complete the order details first.");
    return;
  }
  if(!Object.keys(cart).length){
    alert("Your cart is empty.");
    return;
  }

  const totals=getOrderTotals();
  const orderNumber=createOrderNumber();
  const trackingToken=createTrackingToken();
  const trackingId=trackingToken;

  const orderText=
    "Order Number: "+orderNumber+"\n"+
    totals.lines.map(item=>item.product.name+" × "+item.quantity+" = "+item.itemTotal+" EGP").join("\n")+
    "\nSubtotal: "+totals.subtotal+" EGP"+
    "\nDelivery: "+totals.delivery+" EGP"+
    "\nTotal: "+totals.total+" EGP";

  const orderData={
    number:orderNumber,
    name:name,
    contact:contact,
    items:orderText,
    notes:notes,
    total:Number(totals.total),
    payment:payment,
    status:"received",
    trackingToken:trackingToken,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  };

  try{
    /*
      orderRequests contains customer information and is admin-readable only.
      tracking contains ONLY public tracking information.
    */
    await dardomaDb.collection("orderRequests").add(orderData);
    await dardomaDb.collection("tracking").doc(trackingId).set({
      token:trackingToken,
      number:orderNumber,
      status:"received",
      lat:null,
      lng:null
    });

    /* Keep the existing Google Form workflow too. */
    document.getElementById("gName").value=name;
    document.getElementById("gContact").value=contact;
    document.getElementById("gOrder").value=orderText;
    document.getElementById("gNotes").value=notes;
    document.getElementById("gPayment").value=payment;
    document.getElementById("realGoogleForm").submit();

    showOrderConfirmation(orderNumber,trackingToken);

    cart={};
    localStorage.removeItem("dardoma_cart");
    renderCart();

  }catch(error){
    console.error(error);
    alert("We couldn't save the order yet. Please try again.\n\n"+error.message);
  }
}

function createTrackingToken(){
  const bytes=new Uint8Array(18);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
}

function showOrderConfirmation(orderNumber,trackingToken){
  const trackingUrl=window.location.href.split("#")[0]+"#track="+encodeURIComponent(trackingToken);
  const payment=document.getElementById("paymentMethod").value;
  document.getElementById("result").innerHTML=`
    <div class="success">
      <h2>✅ Order Sent!</h2>
      <p><strong>Order #${escapeHTML(orderNumber)}</strong></p>
      <p>Your private tracking code:</p>
      <p><strong>${escapeHTML(trackingToken)}</strong></p>
      <p class="small-muted">Keep this code private. Anyone with it can view this order's delivery status.</p>
      <button type="button" onclick="openCustomerTracking('${escapeHTML(trackingToken)}')">🔎 Track This Order</button>
      <p class="small-muted" style="word-break:break-all;margin-top:10px">${escapeHTML(trackingUrl)}</p>
      <div class="order-status">
        <strong>📦 Order Status</strong>
        <div class="steps">
          <div class="step active">🟡<br>Received</div>
          <div class="step">🔵<br>Preparing</div>
          <div class="step">🚚<br>Out for delivery</div>
          <div class="step">🟢<br>Delivered</div>
        </div>
      </div>
      ${payment==="Instapay"?"<p>🏦 InstaPay selected. Payment can be handled when the order is delivered.</p>":"<p>💵 Please have the payment ready for cash on delivery.</p>"}
    </div>`;
  document.getElementById("orderForm").style.display="none";
  document.getElementById("reviewSection").style.display="none";
  document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
}

function escapeHTML(text){
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

/*
  Optional direct product-link support.

  Your MAIN STORE can send someone to:
  index.html?product=mango

  That adds the item automatically.

  There are still NO add-to-cart buttons on this page.
*/
const params = new URLSearchParams(window.location.search);
const productFromLink = params.get("product");

if(productFromLink && products[productFromLink]){
  if(isStoreOpen() && !products[productFromLink].soldOut){
    cart[productFromLink] =
      (cart[productFromLink] || 0) + 1;

    saveCart();
  }

  history.replaceState(
    {},
    "",
    window.location.pathname
  );
}

updateStoreStatus();
renderCart();

setInterval(updateStoreStatus,30000);
</script>


</body>
